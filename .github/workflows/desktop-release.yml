name: Native desktop bundles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/package-desktop.sh'
      - 'scripts/launch-native*'
      - 'compose.native.yml'
      - '.github/workflows/desktop-release.yml'
      - 'src/MiniPdm.Desktop/**'
      - 'src/MiniPdm.Contracts/**'
      - 'src/**'
      - 'MiniPdm.sln'
      - 'Dockerfile'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.config/**'
      - 'Directory.Build.props'
      - 'global.json'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build native bundle
        run: bash scripts/package-desktop.sh "$GITHUB_WORKSPACE/artifacts" "${{ matrix.rid }}"
      - uses: actions/upload-artifact@v4
        with:
          name: mini-pdm-${{ matrix.rid }}
          path: artifacts/mini-pdm-${{ matrix.rid }}.*
          if-no-files-found: error
          retention-days: 30
